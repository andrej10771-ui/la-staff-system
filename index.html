<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA Staff System</title>

<style>
:root{
--bg:#0e1117;
--card:#161b22;
--accent:#5865f2;
--green:#00c853;
--red:#ff5252;
--orange:#ff9800;
--purple:#9c27b0;
--gray:#607d8b;
--text:#e6edf3;
}

body{
margin:0;
font-family:Inter,Arial;
background:var(--bg);
color:var(--text);
}

.hidden{display:none}

.center{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:var(--card);
padding:30px;
border-radius:14px;
box-shadow:0 10px 40px rgba(0,0,0,0.6);
width:360px;
}

input,select{
width:100%;
padding:10px;
margin:6px 0;
border-radius:8px;
border:1px solid #222;
background:#0f141a;
color:white;
}

button{
padding:8px 12px;
border-radius:8px;
border:none;
cursor:pointer;
font-weight:600;
}

.btn-primary{background:var(--accent);color:white}
.btn-green{background:var(--green);color:white}
.btn-red{background:var(--red);color:white}
.btn-orange{background:var(--orange);color:white}
.btn-purple{background:var(--purple);color:white}
.btn-gray{background:var(--gray);color:white}

.container{
padding:30px;
max-width:1200px;
margin:auto;
}

.dashboard{
background:var(--card);
padding:20px;
border-radius:14px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
padding:10px;
text-align:center;
border-bottom:1px solid #222;
}

th{background:#11151b}

.rank-owner{color:#ff5252;font-weight:bold}
.rank-management{color:#00e5ff;font-weight:bold}
.rank-admin{color:#ffd740;font-weight:bold}
.rank-mod{color:#69f0ae;font-weight:bold}

.logs{
background:#0f141a;
padding:10px;
border-radius:10px;
height:160px;
overflow:auto;
font-size:13px;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="center">
<div class="card">
<h2>LA Staff System</h2>
<input id="loginUser" placeholder="Benutzername">
<input id="loginPass" type="password" placeholder="Passwort">
<button class="btn-primary" onclick="login()">Login</button>
</div>
</div>

<!-- MAIN -->
<div id="mainPanel" class="hidden container">

<div style="margin-bottom:20px;">
<button onclick="logout()">Logout</button>
<button id="creatorBtn" class="btn-purple hidden" onclick="toggleCreator()">Creator Panel</button>
<button id="lockBtn" class="btn-gray hidden" onclick="toggleLock()">Lockdown</button>
</div>

<div class="dashboard">
<h3>Dashboard</h3>
<div id="dashboardStats"></div>
<button class="btn-primary" onclick="sortByRank()">Nach Rang sortieren</button>
</div>

<h3>Staff hinzufügen / bearbeiten</h3>
<input type="hidden" id="editId">
<input id="roblox" placeholder="Roblox Username">
<input id="discord" placeholder="Discord Username">
<select id="rank">
<option>Creator</option>
<option>Manager</option>
<option>Head of Administration</option>
<option>Administration</option>
<option>Moderator</option>
</select>
<input type="number" id="minutesWeek" placeholder="Minuten Woche">
<input type="number" id="minutesTotal" placeholder="Minuten Total">
<input type="number" id="tickets" placeholder="Tickets">
<label><input type="checkbox" id="notice"> On Notice</label>
<br>
<button class="btn-green" onclick="saveStaff()">Speichern</button>

<h3>Interne Übersicht</h3>
<table>
<thead>
<tr>
<th>Roblox</th><th>Discord</th><th>Rank</th>
<th>Woche</th><th>Total</th><th>Tickets</th>
<th>Notice</th><th>Aktionen</th>
</tr>
</thead>
<tbody id="staffTable"></tbody>
</table>

<div id="creatorPanel" class="hidden">
<h3>Creator Panel</h3>

<h4>Admin Verwaltung</h4>
<input type="hidden" id="adminEditId">
<input id="adminUser" placeholder="Admin Benutzername">
<input id="adminPass" placeholder="Admin Passwort">
<button class="btn-green" onclick="saveAdmin()">Admin Speichern</button>

<table>
<thead><tr><th>User</th><th>Aktionen</th></tr></thead>
<tbody id="adminTable"></tbody>
</table>

<h4>Logs</h4>
<div id="logsBox" class="logs"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const { createClient } = supabase;

const supabaseClient = createClient(
"https://aszymljelmsrjcdmngxc.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzenltbGplbG1zcmpjZG1uZ3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4NzEwNzUsImV4cCI6MjA4NzQ0NzA3NX0.NQmSUGt_NqIHojweHJszfiJ82ElTmLSXYF4eBEEVWeI"
);

/* DOM */
const loginScreen=document.getElementById("loginScreen");
const mainPanel=document.getElementById("mainPanel");
const creatorBtn=document.getElementById("creatorBtn");
const lockBtn=document.getElementById("lockBtn");
const staffTable=document.getElementById("staffTable");
const dashboardStats=document.getElementById("dashboardStats");
const creatorPanel=document.getElementById("creatorPanel");
const adminTable=document.getElementById("adminTable");
const logsBox=document.getElementById("logsBox");

let currentUser="";
let locked=false;

/* LOGIN */
async function login(){
const user=loginUser.value;
const pass=loginPass.value;

if(user==="MrRecc" && pass==="andrej8968"){
currentUser="creator";
creatorBtn.classList.remove("hidden");
lockBtn.classList.remove("hidden");
}else{
const { data,error }=await supabaseClient.from("admins").select("*");
if(error) return alert(error.message);
const found=data.find(a=>a.user===user && a.pass===pass);
if(!found) return alert("Login falsch");
currentUser="admin";
}

loginScreen.classList.add("hidden");
mainPanel.classList.remove("hidden");
loadStaff();
if(currentUser==="creator") loadAdmins();
}

/* LOGOUT */
function logout(){location.reload();}

/* STAFF */
async function saveStaff(){
if(locked) return alert("System im Lockdown!");

const edit=document.getElementById("editId").value;

const payload={
roblox:roblox.value,
discord:discord.value,
rank:rank.value,
minutesweek:+minutesWeek.value||0,
minutestotal:+minutesTotal.value||0,
tickets:+tickets.value||0,
notice:notice.checked
};

if(edit){
await supabaseClient.from("staff").update(payload).eq("id",edit);
await log("Staff bearbeitet: "+roblox.value);
}else{
await supabaseClient.from("staff").insert([payload]);
await log("Staff hinzugefügt: "+roblox.value);
}

document.getElementById("editId").value="";
loadStaff();
}

async function loadStaff(){
const { data,error }=await supabaseClient.from("staff").select("*");
if(error) return console.error(error);

staffTable.innerHTML="";
let totalMin=0,totalTickets=0;

data.forEach(s=>{
totalMin+=s.minutesweek||0;
totalTickets+=s.tickets||0;

staffTable.innerHTML+=`
<tr>
<td>${s.roblox}</td>
<td>${s.discord}</td>
<td>${s.rank}</td>
<td>${s.minutesweek}</td>
<td>${s.minutestotal}</td>
<td>${s.tickets}</td>
<td>${s.notice?"⚠️":""}</td>
<td>
<button class="btn-orange" onclick="editStaff(${s.id})">Edit</button>
<button class="btn-red" onclick="deleteStaff(${s.id})">X</button>
</td>
</tr>`;
});

dashboardStats.innerHTML=
`Gesamt Minuten: <b>${totalMin}</b><br>
Gesamt Tickets: <b>${totalTickets}</b><br>
Staff Anzahl: <b>${data.length}</b>`;
}

async function editStaff(id){
const { data }=await supabaseClient.from("staff").select("*").eq("id",id);
const s=data[0];
editId.value=s.id;
roblox.value=s.roblox;
discord.value=s.discord;
rank.value=s.rank;
minutesWeek.value=s.minutesweek;
minutesTotal.value=s.minutestotal;
tickets.value=s.tickets;
notice.checked=s.notice;
}

async function deleteStaff(id){
await supabaseClient.from("staff").delete().eq("id",id);
await log("Staff gelöscht ID: "+id);
loadStaff();
}

/* ADMIN */
async function saveAdmin(){
const edit=document.getElementById("adminEditId").value;
const payload={user:adminUser.value,pass:adminPass.value};

if(edit){
await supabaseClient.from("admins").update(payload).eq("id",edit);
await log("Admin bearbeitet: "+adminUser.value);
}else{
await supabaseClient.from("admins").insert([payload]);
await log("Admin erstellt: "+adminUser.value);
}

document.getElementById("adminEditId").value="";
loadAdmins();
}

async function loadAdmins(){
const { data }=await supabaseClient.from("admins").select("*");
adminTable.innerHTML="";
data.forEach(a=>{
adminTable.innerHTML+=`
<tr>
<td>${a.user}</td>
<td>
<button class="btn-orange" onclick="editAdmin(${a.id})">Edit</button>
<button class="btn-red" onclick="deleteAdmin(${a.id})">X</button>
</td>
</tr>`;
});
}

async function editAdmin(id){
const { data }=await supabaseClient.from("admins").select("*").eq("id",id);
const a=data[0];
adminEditId.value=a.id;
adminUser.value=a.user;
adminPass.value=a.pass;
}

async function deleteAdmin(id){
await supabaseClient.from("admins").delete().eq("id",id);
await log("Admin gelöscht ID: "+id);
loadAdmins();
}

/* LOCK */
function toggleLock(){
locked=!locked;
log("Lockdown: "+(locked?"Aktiviert":"Deaktiviert"));
}

/* LOGS */
async function log(text){
await supabaseClient.from("logs").insert([{message:text}]);
loadLogs();
}

async function loadLogs(){
const { data }=await supabaseClient.from("logs").select("*").order("id",{ascending:false});
logsBox.innerHTML=data.map(l=>l.message).join("<br>");
}

/* SORT */
async function sortByRank(){
const order=["Creator","Manager","Head of Administration","Administration","Moderator"];
const { data }=await supabaseClient.from("staff").select("*");
data.sort((a,b)=>order.indexOf(a.rank)-order.indexOf(b.rank));
staffTable.innerHTML="";
data.forEach(s=>{
staffTable.innerHTML+=`
<tr>
<td>${s.roblox}</td>
<td>${s.discord}</td>
<td>${s.rank}</td>
<td>${s.minutesweek}</td>
<td>${s.minutestotal}</td>
<td>${s.tickets}</td>
<td>${s.notice?"⚠️":""}</td>
<td>
<button class="btn-orange" onclick="editStaff(${s.id})">Edit</button>
<button class="btn-red" onclick="deleteStaff(${s.id})">X</button>
</td>
</tr>`;
});
}
</script>
</body>
</html>
