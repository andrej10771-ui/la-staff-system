<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA Staff System</title>

<style>
body{margin:0;font-family:Arial;background:#0f1117;color:#fff}
.hidden{display:none}
.center{display:flex;justify-content:center;align-items:center;height:100vh}
.card{background:#1a1f2b;padding:30px;border-radius:12px;width:340px}
input,select{width:100%;padding:8px;margin:6px 0;border-radius:6px;border:none;background:#111;color:#fff}
button{padding:8px 12px;border-radius:6px;border:none;cursor:pointer;margin-top:6px}
.btn{background:#5865f2;color:#fff}
.btn-red{background:#ff5252;color:#fff}
.btn-green{background:#00c853;color:#fff}
.container{padding:20px;max-width:1200px;margin:auto}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{padding:8px;text-align:center;border-bottom:1px solid #333}
th{background:#111}
.dashboard{background:#1a1f2b;padding:15px;border-radius:10px;margin-bottom:20px}
.logs{background:#111;padding:10px;border-radius:10px;height:150px;overflow:auto}
</style>
</head>
<body>

<div id="loginScreen" class="center">
<div class="card">
<h2>Login</h2>
<input id="loginUser" placeholder="User">
<input id="loginPass" type="password" placeholder="Pass">
<button class="btn" onclick="login()">Login</button>
</div>
</div>

<div id="mainPanel" class="hidden container">

<button onclick="logout()">Logout</button>
<button id="creatorBtn" class="btn hidden" onclick="toggleCreator()">Creator Panel</button>

<div class="dashboard">
<h3>Dashboard</h3>
<div id="dashboardStats"></div>
</div>

<h3>Staff</h3>
<input type="hidden" id="editId">
<input id="roblox" placeholder="Roblox">
<input id="discord" placeholder="Discord">
<select id="rank">
<option>Creator</option>
<option>Manager</option>
<option>Administration</option>
<option>Moderator</option>
</select>
<input type="number" id="minutesWeek" placeholder="Minuten Woche">
<input type="number" id="minutesTotal" placeholder="Minuten Total">
<input type="number" id="tickets" placeholder="Tickets">
<label><input type="checkbox" id="notice"> Notice</label>
<br>
<button class="btn-green" onclick="saveStaff()">Speichern</button>

<table>
<thead>
<tr>
<th>Roblox</th>
<th>Discord</th>
<th>Rank</th>
<th>Woche</th>
<th>Total</th>
<th>Tickets</th>
<th>Notice</th>
<th>Aktion</th>
</tr>
</thead>
<tbody id="staffTable"></tbody>
</table>

<div id="creatorPanel" class="hidden">
<h3>Logs</h3>
<div id="logsBox" class="logs"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const { createClient } = supabase;

const supabaseClient = createClient(
"https://aszymljelmsrjcdmngxc.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzenltbGplbG1zcmpjZG1uZ3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4NzEwNzUsImV4cCI6MjA4NzQ0NzA3NX0.NQmSUGt_NqIHojweHJszfiJ82ElTmLSXYF4eBEEVWeI"
);

const loginScreen = document.getElementById("loginScreen");
const mainPanel = document.getElementById("mainPanel");
const creatorBtn = document.getElementById("creatorBtn");
const staffTable = document.getElementById("staffTable");
const dashboardStats = document.getElementById("dashboardStats");
const creatorPanel = document.getElementById("creatorPanel");
const logsBox = document.getElementById("logsBox");

let currentUser = "";

async function login(){
const user = document.getElementById("loginUser").value;
const pass = document.getElementById("loginPass").value;

if(user === "MrRecc" && pass === "andrej8968"){
currentUser = "creator";
creatorBtn.classList.remove("hidden");
}else{
alert("Login falsch");
return;
}

loginScreen.classList.add("hidden");
mainPanel.classList.remove("hidden");
loadStaff();
}

function logout(){
location.reload();
}

async function saveStaff(){

const payload = {
roblox: document.getElementById("roblox").value,
discord: document.getElementById("discord").value,
rank: document.getElementById("rank").value,
minutesweek: +document.getElementById("minutesWeek").value || 0,
minutestotal: +document.getElementById("minutesTotal").value || 0,
tickets: +document.getElementById("tickets").value || 0,
notice: document.getElementById("notice").checked
};

await supabaseClient.from("staff").insert([payload]);
await log("Staff hinzugefügt");

loadStaff();
}

async function loadStaff(){

const { data, error } = await supabaseClient.from("staff").select("*");

if(error){
console.error(error);
return;
}

staffTable.innerHTML = "";

let totalMin = 0;
let totalTickets = 0;

data.forEach(s => {

totalMin += s.minutesweek || 0;
totalTickets += s.tickets || 0;

staffTable.innerHTML += `
<tr>
<td>${s.roblox}</td>
<td>${s.discord}</td>
<td>${s.rank}</td>
<td>${s.minutesweek}</td>
<td>${s.minutestotal}</td>
<td>${s.tickets}</td>
<td>${s.notice ? "⚠️" : ""}</td>
<td><button class="btn-red" onclick="deleteStaff(${s.id})">X</button></td>
</tr>
`;
});

dashboardStats.innerHTML = 
"Gesamt Minuten: " + totalMin + "<br>" +
"Gesamt Tickets: " + totalTickets + "<br>" +
"Staff Anzahl: " + data.length;

}

async function deleteStaff(id){
await supabaseClient.from("staff").delete().eq("id", id);
await log("Staff gelöscht ID: " + id);
loadStaff();
}

function toggleCreator(){
creatorPanel.classList.toggle("hidden");
loadLogs();
}

async function log(text){
await supabaseClient.from("logs").insert([{message: text}]);
loadLogs();
}

async function loadLogs(){
const { data } = await supabaseClient.from("logs").select("*").order("id",{ascending:false});
logsBox.innerHTML = data.map(l => l.message).join("<br>");
}
</script>
</body>
</html>
