<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA Staff System</title>

<style>
body{font-family:Arial;background:#0f0f0f;color:white;margin:0}
.center-login{display:flex;justify-content:center;align-items:center;height:100vh}
.login-box{background:#1a1a1a;padding:30px;border-radius:10px;width:320px;text-align:center}
input,select{width:100%;padding:8px;margin:6px 0;border-radius:5px;border:none}
button{padding:6px 10px;margin:4px;border:none;border-radius:5px;cursor:pointer}

.save{background:#00c853;color:white}
.edit{background:#ff9800;color:white}
.delete{background:#d32f2f;color:white}
.creator{background:#9c27b0;color:white}
.lock{background:#607d8b;color:white}
.sort{background:#3f51b5;color:white}

.hidden{display:none}
.container{padding:20px}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px;border-bottom:1px solid #333;text-align:center}
th{background:#1f1f1f}

.rank-owner{color:#ff5252;font-weight:bold}
.rank-management{color:#00e5ff;font-weight:bold}
.rank-admin{color:#ffd740;font-weight:bold}
.rank-mod{color:#69f0ae;font-weight:bold}

.dashboard{background:#1a1a1a;padding:15px;border-radius:10px;margin-bottom:15px}
</style>
</head>
<body>

<div class="center-login" id="loginScreen">
<div class="login-box">
<h2>Login</h2>
<input id="loginUser" placeholder="Benutzername">
<input id="loginPass" type="password" placeholder="Passwort">
<button class="save" onclick="login()">Login</button>
</div>
</div>

<div id="mainPanel" class="hidden container">

<button onclick="logout()">Logout</button>
<button class="creator hidden" id="creatorBtn" onclick="toggleCreator()">Creator Panel</button>
<button class="lock hidden" id="lockBtn" onclick="toggleLock()">Lockdown</button>

<div class="dashboard">
<h3>Wochen Dashboard</h3>
<div id="dashboardStats"></div>
<button class="sort" onclick="sortByRank()">Nach Rang sortieren</button>
</div>

<h3>Staff hinzufügen / bearbeiten</h3>
<input type="hidden" id="editId">
<input id="roblox" placeholder="Roblox Username">
<input id="discord" placeholder="Discord Username">
<select id="rank">
<option>Creator</option>
<option>Manager</option>
<option>Head of Administration</option>
<option>Administration</option>
<option>Moderator</option>
</select>
<input type="number" id="minutesWeek" placeholder="Minuten Woche">
<input type="number" id="minutesTotal" placeholder="Minuten Total">
<input type="number" id="tickets" placeholder="Tickets">
<label><input type="checkbox" id="notice"> On Notice</label>
<button class="save" onclick="saveStaff()">Speichern</button>

<h3>Interne Übersicht</h3>
<table>
<thead>
<tr>
<th>Roblox</th><th>Discord</th><th>Rank</th>
<th>Woche</th><th>Total</th><th>Tickets</th>
<th>Notice</th><th>Aktionen</th>
</tr>
</thead>
<tbody id="staffTable"></tbody>
</table>

<div id="creatorPanel" class="hidden">
<h3>Creator Panel</h3>

<h4>Admin Verwaltung</h4>
<input type="hidden" id="adminEditId">
<input id="adminUser" placeholder="Admin Benutzername">
<input id="adminPass" placeholder="Admin Passwort">
<button class="save" onclick="saveAdmin()">Admin Speichern</button>

<table>
<thead><tr><th>User</th><th>Aktionen</th></tr></thead>
<tbody id="adminTable"></tbody>
</table>

<h4>Creator Logs</h4>
<div id="logsBox" style="background:#111;padding:10px;height:150px;overflow:auto"></div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const { createClient } = supabase;

const supabaseClient = createClient(
"https://aszymljelmsrjcdmngxc.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzenltbGplbG1zcmpjZG1uZ3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4NzEwNzUsImV4cCI6MjA4NzQ0NzA3NX0.NQmSUGt_NqIHojweHJszfiJ82ElTmLSXYF4eBEEVWeI"
);

let currentUser="";
let locked=false;

function getRankClass(rank){
if(rank==="Creator") return "rank-owner";
if(rank==="Manager") return "rank-management";
if(rank.includes("Administration")) return "rank-admin";
return "rank-mod";
}

function logout(){ location.reload(); }

async function login(){
const user=loginUser.value;
const pass=loginPass.value;

if(user==="MrRecc" && pass==="andrej8968"){
currentUser="creator";
creatorBtn.classList.remove("hidden");
lockBtn.classList.remove("hidden");
}
else{
const { data } = await supabaseClient.from("admins").select("*");
const found=data.find(a=>a.user===user && a.pass===pass);
if(!found) return alert("Login falsch");
currentUser="admin";
}

loginScreen.classList.add("hidden");
mainPanel.classList.remove("hidden");
loadStaff();
if(currentUser==="creator") loadAdmins();
}

async function saveStaff(){
if(locked) return alert("System im Lockdown!");

const edit=editId.value;

if(edit){
await supabaseClient.from("staff").update({
roblox:roblox.value,
discord:discord.value,
rank:rank.value,
minutesweek:+minutesWeek.value||0,
minutestotal:+minutesTotal.value||0,
tickets:+tickets.value||0,
notice:notice.checked
}).eq("id",edit);
log("Staff bearbeitet");
}
else{
await supabaseClient.from("staff").insert([{
roblox:roblox.value,
discord:discord.value,
rank:rank.value,
minutesweek:+minutesWeek.value||0,
minutestotal:+minutesTotal.value||0,
tickets:+tickets.value||0,
notice:notice.checked
}]);
log("Staff hinzugefügt");
}

editId.value="";
loadStaff();
}

async function loadStaff(){
const { data } = await supabaseClient.from("staff").select("*");
staffTable.innerHTML="";
let totalMin=0,totalTickets=0;

data.forEach(s=>{
totalMin+=s.minutesweek||0;
totalTickets+=s.tickets||0;

staffTable.innerHTML+=`
<tr>
<td>${s.roblox}</td>
<td>${s.discord}</td>
<td class="${getRankClass(s.rank)}">${s.rank}</td>
<td>${s.minutesweek}</td>
<td>${s.minutestotal}</td>
<td>${s.tickets}</td>
<td>${s.notice?"⚠️":""}</td>
<td>
<button class="edit" onclick="editStaff(${s.id})">Bearbeiten</button>
<button class="delete" onclick="deleteStaff(${s.id})">X</button>
</td>
</tr>`;
});

dashboardStats.innerHTML=
"Gesamt Minuten: "+totalMin+
"<br>Gesamt Tickets: "+totalTickets+
"<br>Staff Anzahl: "+data.length;
}

async function editStaff(id){
const { data } = await supabaseClient.from("staff").select("*").eq("id",id);
const s=data[0];
editId.value=s.id;
roblox.value=s.roblox;
discord.value=s.discord;
rank.value=s.rank;
minutesWeek.value=s.minutesweek;
minutesTotal.value=s.minutestotal;
tickets.value=s.tickets;
notice.checked=s.notice;
}

async function deleteStaff(id){
await supabaseClient.from("staff").delete().eq("id",id);
log("Staff gelöscht");
loadStaff();
}

function toggleCreator(){
creatorPanel.classList.toggle("hidden");
loadLogs();
}

function toggleLock(){
locked=!locked;
log("Lockdown geändert");
}

async function saveAdmin(){
const edit=adminEditId.value;

if(edit){
await supabaseClient.from("admins").update({
user:adminUser.value,
pass:adminPass.value
}).eq("id",edit);
log("Admin bearbeitet");
}
else{
await supabaseClient.from("admins").insert([{
user:adminUser.value,
pass:adminPass.value
}]);
log("Admin erstellt");
}

adminEditId.value="";
loadAdmins();
}

async function loadAdmins(){
const { data } = await supabaseClient.from("admins").select("*");
adminTable.innerHTML="";
data.forEach(a=>{
adminTable.innerHTML+=`
<tr>
<td>${a.user}</td>
<td>
<button class="edit" onclick="editAdmin(${a.id})">Bearbeiten</button>
<button class="delete" onclick="deleteAdmin(${a.id})">X</button>
</td>
</tr>`;
});
}

async function editAdmin(id){
const { data } = await supabaseClient.from("admins").select("*").eq("id",id);
const a=data[0];
adminEditId.value=a.id;
adminUser.value=a.user;
adminPass.value=a.pass;
}

async function deleteAdmin(id){
await supabaseClient.from("admins").delete().eq("id",id);
log("Admin gelöscht");
loadAdmins();
}

async function sortByRank(){
const order=["Creator","Manager","Head of Administration","Administration","Moderator"];
const { data } = await supabaseClient.from("staff").select("*");
data.sort((a,b)=>order.indexOf(a.rank)-order.indexOf(b.rank));
for(let i=0;i<data.length;i++){
await supabaseClient.from("staff").update({created_at:new Date()}).eq("id",data[i].id);
}
loadStaff();
}

async function log(text){
await supabaseClient.from("logs").insert([{message:text}]);
loadLogs();
}

async function loadLogs(){
const { data } = await supabaseClient.from("logs").select("*").order("id",{ascending:false});
logsBox.innerHTML=data.map(l=>l.message).join("<br>");
}
</script>
</body>
</html>
