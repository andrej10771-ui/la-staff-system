<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los Angeles Staff System COMPLETE</title>

<style>
body { font-family: Arial; background:#0f0f0f; color:white; margin:0; }
.center-login { display:flex; justify-content:center; align-items:center; height:100vh; }
.login-box { background:#1a1a1a; padding:30px; border-radius:10px; width:300px; text-align:center; }
input, select { width:100%; padding:8px; margin:6px 0; border-radius:5px; border:none; }
button { padding:6px 10px; margin:4px; border:none; border-radius:5px; cursor:pointer; }

.save-btn{background:#00c853;color:white;}
.edit-btn{background:#ff9800;color:white;}
.delete-btn{background:#d32f2f;color:white;}
.creator-btn{background:#9c27b0;color:white;}
.lock-btn{background:#607d8b;color:white;}
.sort-btn{background:#673ab7;color:white;}
.toggle-btn{background:#444;color:white;}

.container{padding:15px;}
table{ width:100%; border-collapse:collapse; font-size:13px; }
th,td{ padding:6px; border-bottom:1px solid #333; text-align:center; }
th{background:#1f1f1f;}

.rank-owner{color:#ff5252;font-weight:bold;}
.rank-management{color:#00e5ff;font-weight:bold;}
.rank-admin{color:#ffd740;font-weight:bold;}
.rank-mod{color:#69f0ae;font-weight:bold;}

function getRankClass(rank){

if(rank.includes("Creator") || rank.includes("Projektleitung"))
    return "rank-owner";

if(rank.includes("Manager") || rank.includes("Teamverwaltung"))
    return "rank-management";

if(rank.includes("Head") || rank.includes("Administration"))
    return "rank-admin";

if(rank.includes("Moderator"))
    return "rank-mod";

return "";
}

.green{color:#00ff88;font-weight:bold;}
.red{color:#ff4444;font-weight:bold;}
.hidden{display:none;}

.dashboard{background:#1a1a1a;padding:15px;border-radius:10px;margin-bottom:15px;}
.dragging{opacity:0.5;}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="center-login" id="loginScreen">
<div class="login-box">
<h2>Staff System Login</h2>
<input type="text" id="loginUser" placeholder="Benutzername">
<input type="password" id="loginPass" placeholder="Passwort">
<button class="save-btn" onclick="login()">Login</button>
</div>
</div>

<!-- PUBLIC -->
<div class="container">
<button class="toggle-btn" onclick="togglePublic()">Team anzeigen / ausblenden</button>
<div id="publicSection">
<h3>Öffentliche Team Übersicht</h3>
<table>
<thead>
<tr>
<th>Roblox</th><th>Rank</th><th>Woche</th><th>Total</th><th>Tickets</th>
</tr>
</thead>
<tbody id="publicStaffTable"></tbody>
</table>
</div>
</div>

<!-- MAIN PANEL -->
<div id="mainPanel" class="hidden container">

<button onclick="logout()">Logout</button>
<button class="creator-btn hidden" id="creatorBtn" onclick="toggleCreator()">Creator Panel</button>
<button class="lock-btn hidden" id="lockBtn" onclick="lockSystem()">Lockdown</button>

<div class="dashboard">
<h3>Wochen Dashboard</h3>
<div id="dashboardStats"></div>
<button class="sort-btn" onclick="sortByRank()">Nach Rang sortieren</button>
</div>

<h3>Staff hinzufügen / bearbeiten</h3>
<input type="hidden" id="editIndex">
<input type="text" id="roblox" placeholder="Roblox Username">
<input type="text" id="discord" placeholder="Discord Username">

<select id="rank">
<option>Creator</option>
<option>Co-Creator</option>
<option>Projektleitung</option>
<option>Stv.Projektleitung</option>
<option>Manager</option>
<option>Community Manager</option>
<option>Teamverwaltung</option>
<option>Stv. Teamverwaltung</option>
<option>Head of Administration</option>
<option>Head of Moderation</option>
<option>Senior Administration</option>
<option>Administration</option>
<option>Junior Administration</option>
<option>Senior Moderator</option>
<option>Moderator</option>
<option>Junior Moderator</option>
</select>

<input type="number" id="minutesWeek" placeholder="Minuten Woche">
<input type="number" id="minutesTotal" placeholder="Minuten Total">
<input type="number" id="tickets" placeholder="Tickets">
<label><input type="checkbox" id="notice"> On Notice</label>

<button class="save-btn" onclick="saveStaff()">Speichern</button>

<h3>Interne Staff Übersicht (Drag & Drop aktiv)</h3>
<table>
<thead>
<tr>
<th>Roblox</th><th>Discord</th><th>Rank</th>
<th>Woche</th><th>Total</th><th>Tickets</th>
<th>Status</th><th>Notice</th><th>Aktionen</th>
</tr>
</thead>
<tbody id="staffTable"></tbody>
</table>

<!-- CREATOR PANEL -->
<div id="creatorPanel" class="hidden">
<h3>Creator Panel</h3>

<h4>Admin Verwaltung</h4>
<input type="hidden" id="adminEditIndex">
<input type="text" id="adminUser" placeholder="Admin Benutzername">
<input type="password" id="adminPass" placeholder="Admin Passwort">
<button class="save-btn" onclick="saveAdmin()">Admin Speichern</button>

<table>
<thead>
<tr><th>User</th><th>Aktionen</th></tr>
</thead>
<tbody id="adminTable"></tbody>
</table>

<h4>Security Logs</h4>
<div id="logsBox" style="background:#111;padding:10px;height:150px;overflow:auto;font-size:12px;"></div>

<button class="lock-btn" onclick="unlockSystem()">Unlock System</button>
</div>

</div>

<script>

// =======================
// SUPABASE CONFIG
// =======================

const SUPABASE_URL = "HIER_DEINE_URL_EINFÜGEN";
const SUPABASE_ANON_KEY = "HIER_DEIN_ANON_KEY_EINFÜGEN";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

// =======================
// LOGIN DATA
// =======================

const CREATOR_USER="MrRecc";
const CREATOR_PASS="andrej8968";
const MASTER_PASSWORD="MASTERKEY1711";

let currentUser="";
let locked=false;
let deleteCounter=0;

// =======================
// LOGIN
// =======================

function login(){
if(locked){ alert("System ist im Lockdown!"); return; }

const user=loginUser.value;
const pass=loginPass.value;

if(user===CREATOR_USER && pass===CREATOR_PASS){
currentUser="creator";
creatorBtn.classList.remove("hidden");
lockBtn.classList.remove("hidden");
}
else{
alert("Login falsch");
return;
}

loginScreen.classList.add("hidden");
mainPanel.classList.remove("hidden");
loadStaff();
}

// =======================
// LOGOUT
// =======================

function logout(){ location.reload(); }

// =======================
// SAVE STAFF (SUPABASE)
// =======================

async function saveStaff(){

if(locked) return alert("System ist im Lockdown!");

const { error } = await supabase
.from("staff")
.insert([{
roblox: roblox.value,
discord: discord.value,
rank: rank.value,
minutesweek: +minutesWeek.value || 0,
minutestotal: +minutesTotal.value || 0,
tickets: +tickets.value || 0,
notice: notice.checked
}]);

if(error){
alert("Fehler: "+error.message);
console.error(error);
}
else{
loadStaff();
}
}

// =======================
// DELETE STAFF
// =======================

async function deleteStaff(id){

if(currentUser!=="creator") return;

const { error } = await supabase
.from("staff")
.delete()
.eq("id", id);

if(error){
alert("Fehler beim Löschen");
console.error(error);
}
else{
loadStaff();
}
}

// =======================
// LOAD STAFF
// =======================

async function loadStaff(){

const { data, error } = await supabase
.from("staff")
.select("*")
.order("rank",{ascending:true});

if(error){
console.error(error);
return;
}

staffTable.innerHTML="";
publicStaffTable.innerHTML="";

let totalMinutes=0;
let totalTickets=0;

data.forEach((s)=>{

totalMinutes+=s.minutesweek || 0;
totalTickets+=s.tickets || 0;

staffTable.innerHTML+=`
<tr>
<td>${s.roblox}</td>
<td>${s.discord}</td>
<td>${s.rank}</td>
<td>${s.minutesweek}</td>
<td>${s.minutestotal}</td>
<td>${s.tickets}</td>
<td>${s.notice?"⚠️":""}</td>
<td><button class="delete-btn" onclick="deleteStaff('${s.id}')">X</button></td>
</tr>`;

publicStaffTable.innerHTML+=`
<tr>
<td>${s.roblox}</td>
<td>${s.rank}</td>
<td>${s.minutesweek}</td>
<td>${s.minutestotal}</td>
<td>${s.tickets}</td>
</tr>`;

});

dashboardStats.innerHTML=`
Gesamt Minuten: <b>${totalMinutes}</b><br>
Gesamt Tickets: <b>${totalTickets}</b><br>
Staff Anzahl: <b>${data.length}</b>
`;
}

// =======================
// LOCK SYSTEM
// =======================

function lockSystem(){
if(currentUser!=="creator") return;
locked=true;
alert("System gesperrt");
}

function unlockSystem(){
const key=prompt("Creator Passwort:");
if(key===CREATOR_PASS){
locked=false;
alert("System entsperrt");
}
}

// =======================
// PUBLIC TOGGLE
// =======================

function togglePublic(){
publicSection.classList.toggle("hidden");
}

// =======================
// INIT
// =======================

document.addEventListener("DOMContentLoaded", loadStaff);

</script>
</body>
</html>
